<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>beads-hud</title>
<link rel="stylesheet" href="/beads-hud.css" />
<link rel="stylesheet" href="/workspace.css" />
</head>
<body>
<!-- Quiet workspace: one persistent project sidebar, paper-white reading
surfaces, compact controls and a restrained violet action. Local bd remains
 the source of truth; board, list, graph, docs and actions share their original data flows. -->

<svg class="sprite" aria-hidden="true">
  <symbol id="i-board" viewBox="0 0 20 20"><rect x="2.75" y="2.75" width="5.5" height="14.5" rx="1.5"/><rect x="11.75" y="2.75" width="5.5" height="8.5" rx="1.5"/></symbol>
  <symbol id="i-docs" viewBox="0 0 20 20"><path d="M4.75 3.75h6.5l4 4v8.5a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.5-1.5v-11a1.5 1.5 0 0 1 1.5-1.5Z"/><path d="M11 3.9V8h4.1"/></symbol>
  <symbol id="i-theme" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.25"/><path d="M10 3.75v12.5" /><path d="M10 5.6a4.4 4.4 0 0 1 0 8.8" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.75v10.5M4.75 10h10.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></symbol>
  <symbol id="i-down" viewBox="0 0 20 20"><path d="M6 8.25 10 12l4-3.75"/></symbol>
  <symbol id="i-back" viewBox="0 0 20 20"><path d="M12 5.5 7.5 10l4.5 4.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 20 20"><path d="M3.25 6.25a1.5 1.5 0 0 1 1.5-1.5h2.6l1.6 2h5.8a1.5 1.5 0 0 1 1.5 1.5v6.5a1.5 1.5 0 0 1-1.5 1.5H4.75a1.5 1.5 0 0 1-1.5-1.5Z"/></symbol>
  <symbol id="i-link" viewBox="0 0 20 20"><path d="M8.5 11.5a3 3 0 0 0 4.24 0l2-2a3 3 0 0 0-4.24-4.24l-.8.8"/><path d="M11.5 8.5a3 3 0 0 0-4.24 0l-2 2a3 3 0 0 0 4.24 4.24l.8-.8"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="m5.5 10.5 3 3 6-7"/></symbol>
  <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.25"/><path d="M10 6.5V10l2.5 1.75"/></symbol>
  <symbol id="i-list" viewBox="0 0 20 20"><path d="M7 5.25h9.25M7 10h9.25M7 14.75h9.25"/><path d="M3.75 5.25h.01M3.75 10h.01M3.75 14.75h.01"/></symbol>
  <symbol id="i-graph" viewBox="0 0 20 20"><circle cx="5" cy="10" r="2.25"/><circle cx="15" cy="4.75" r="2.25"/><circle cx="15" cy="15.25" r="2.25"/><path d="M7 9 12.9 5.6M7 11l5.9 3.4"/></symbol>
  <symbol id="i-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.25"/><path d="m13 13 3.75 3.75"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M15.4 11.5a5.6 5.6 0 1 1-.9-4.6"/><path d="M15.9 3.6v3.3h-3.3"/></symbol>
</svg>

<nav id="workspace-nav" class="rail glass" aria-label="Разделы">
  <a class="rail__mark" href="/" aria-label="beads-hud">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 1.5C6 6 6 18 12 22.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.4 8.4h19.2M2.4 15.6h19.2" stroke="currentColor" stroke-width="1.4"/></svg>
    <span class="rail__brand">beads-hud</span>
  </a>
  <div class="rail__project"><span class="rail__eyebrow">Рабочее пространство</span><div class="rail__picker">  <span class="dot dot--project" aria-hidden="true"></span>
  <label class="crumb">
    <select id="project" aria-label="Проект"></select>
    <svg class="ico ico--sm" aria-hidden="true"><use href="#i-down"/></svg>
  </label>
</div></div>
  <button class="rail__tab" id="tab-board" type="button" aria-current="true" title="Задачи">
    <svg class="ico" aria-hidden="true"><use href="#i-board"/></svg><span class="rail__label">Задачи</span>
  </button>
  <button class="rail__tab" id="tab-docs" type="button" aria-current="false" title="Документы">
    <svg class="ico" aria-hidden="true"><use href="#i-docs"/></svg><span class="rail__label">Документы</span>
  </button>
  <aside class="kinds" id="kinds" aria-label="Виды работ"></aside>
  <div class="rail__footer"><span class="rail__local">Локальный проект · bd</span>
  <button class="rail__tab rail__tab--foot" id="theme" type="button" title="Тема: светлая">
    <svg class="ico" aria-hidden="true"><use href="#i-theme"/></svg><span class="rail__label" id="theme-label">Светлая тема</span>
  </button></div>
</nav>

<header class="top glass">
  <button class="icon-btn mobile-nav" id="mobile-nav" type="button" aria-label="Проект и фильтры" aria-controls="workspace-nav" aria-expanded="false"><svg class="ico ico--sm" aria-hidden="true"><use href="#i-folder"/></svg></button>
  <svg class="ico ico--sm" aria-hidden="true"><use href="#i-board"/></svg>
  <span class="crumb crumb--static" id="view-name">задачи</span>
  <span class="top__note" id="crumb"></span>
  <span class="spacer"></span>
  <span class="fresh" id="fresh" role="status"></span>
  <button class="icon-btn" id="refresh" type="button" title="Обновить сейчас" aria-label="Обновить сейчас">
    <svg class="ico ico--sm" aria-hidden="true"><use href="#i-refresh"/></svg>
  </button>
  <button class="btn btn--accent" id="new-task" type="button" aria-label="Новая задача">
    <svg class="ico ico--sm" aria-hidden="true"><use href="#i-plus"/></svg>
    <span class="btn__label">Новая задача</span>
  </button>
</header>

<main class="canvas" id="canvas">
  <section class="view" id="view-board">
    <div class="view__bar">
      <div class="seg" role="group" aria-label="Вид задач" style="--seg-n:3" id="task-seg">
        <span class="seg__thumb" aria-hidden="true"></span>
        <button class="seg__btn" id="tv-board" type="button" aria-pressed="true">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-board"/></svg><span class="seg__label">Доска</span>
        </button>
        <button class="seg__btn" id="tv-table" type="button" aria-pressed="false">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-list"/></svg><span class="seg__label">Список</span>
        </button>
        <button class="seg__btn" id="tv-graph" type="button" aria-pressed="false" title="Дерево эпиков и стрелки блокировок">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-graph"/></svg><span class="seg__label">Граф</span>
        </button>
      </div>
      <label class="search">
        <svg class="ico ico--sm" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search-tasks" type="search" placeholder="Поиск задач" autocomplete="off" aria-label="Поиск задач" />
      </label>
      <span class="spacer"></span>
      <button class="toggle" id="show-closed" type="button" aria-pressed="false" aria-label="Показывать закрытые задачи" title="Показывать закрытые задачи">
        <span class="light light--closed" aria-hidden="true"></span>
        <span class="toggle__label">Закрытые</span>
        <span class="toggle__n" id="closed-n"></span>
      </button>
    </div>
    <div class="board" id="board"></div>
    <div class="tbl" id="tbl" hidden></div>
    <div class="graph" id="graphview" hidden></div>
    <footer class="view__footer"><span id="task-count"></span><span>beads · источник данных</span></footer>
  </section>

  <section class="view" id="view-docs" hidden>
    <div class="view__head">
      <h1 class="view__title">Документы</h1>
      <div class="seg" role="group" aria-label="Раскладка документов" style="--seg-n:2" id="docs-seg">
        <span class="seg__thumb" aria-hidden="true"></span>
        <button class="seg__btn" id="by-dir" type="button" aria-pressed="true">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-folder"/></svg>по папкам
        </button>
        <button class="seg__btn" id="by-epic" type="button" aria-pressed="false" title="Колонка — эпик или задача, которая ссылается на документ">
          <svg class="ico ico--sm" aria-hidden="true"><use href="#i-link"/></svg>по работе
        </button>
      </div>
      <label class="search">
        <svg class="ico ico--sm" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search-docs" type="search" placeholder="Поиск документов" autocomplete="off" aria-label="Поиск документов" />
      </label>
    </div>
    <div class="board board--docs" id="docs-board"></div>
  </section>

  <section class="view view--read" id="view-read" hidden>
    <div class="read__bar">
      <button class="btn btn--quiet" id="read-back" type="button">
        <svg class="ico ico--sm" aria-hidden="true"><use href="#i-back"/></svg>Документы
      </button>
      <span class="read__path" id="read-path"></span>
      <span class="spacer"></span>
      <span class="read__hint">нажмите на абзац, чтобы поправить его</span>
      <span class="read__meta" id="read-meta"></span>
    </div>
    <article class="read" id="read"></article>
  </section>
</main>

<aside class="drawer" id="task" hidden aria-label="Задача">
  <div class="drawer__head">
    <span class="mono" id="task-id"></span>
    <span class="spacer"></span>
    <button class="btn" id="task-move" type="button">В работу</button>
    <button class="btn btn--quiet" id="task-release" type="button" hidden>Вернуть в открытые</button>
    <button class="btn" id="task-shut" type="button">Закрыть</button>
    <button class="icon-btn icon-btn--apart" id="task-x" type="button" aria-label="Скрыть панель" title="Скрыть панель">
      <svg class="ico ico--sm" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <div class="drawer__body" id="task-body"></div>
</aside>

<form class="dialog" id="entry" hidden>
  <h2>Новая задача</h2>
  <label class="field">
    <span>Заголовок</span>
    <input id="entry-title" autocomplete="off" required />
  </label>
  <div class="field-row">
    <label class="field">
      <span>Тип</span>
      <select id="entry-type">
        <option value="task">task</option>
        <option value="feature">feature</option>
        <option value="bug">bug</option>
        <option value="epic">epic</option>
      </select>
    </label>
    <label class="field">
      <span>Приоритет</span>
      <select id="entry-priority">
        <option value="0">P0</option><option value="1">P1</option>
        <option value="2" selected>P2</option><option value="3">P3</option><option value="4">P4</option>
      </select>
    </label>
  </div>
  <label class="field">
    <span>Эпик</span>
    <select id="entry-parent"><option value="">без эпика</option></select>
  </label>
  <p class="field-err" id="entry-err" hidden></p>
  <div class="dialog__acts">
    <button type="button" class="btn btn--quiet" id="entry-cancel">Отмена</button>
    <button type="submit" class="btn btn--accent">Создать</button>
  </div>
</form>
<div class="scrim" id="scrim" hidden></div>

<p class="toast" id="toast" role="status" aria-live="polite"></p>

<script type="module" src="/beads-hud.js"></script>
</body>
</html>
